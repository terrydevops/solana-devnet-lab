# compose files, playbooks and prometheus rules carry long lines on purpose
extends: default
rules:
  line-length: disable
  document-start: disable
  comments-indentation: disable
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  # the inventory aligns its host variables in columns
  colons:
    max-spaces-after: -1
  commas:
    max-spaces-after: -1
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']
    check-keys: false   # `on:` in workflows
