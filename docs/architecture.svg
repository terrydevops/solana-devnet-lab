<rect x="990" y="612" width="140" height="100" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
<text x="1060.0" y="638" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Grafana</text>
<text x="1060.0" y="658" font-size="13" text-anchor="middle" fill="#333">dashboards from</text>
<text x="1060.0" y="676" font-size="13" text-anchor="middle" fill="#333">Prometheus and Loki</text>
