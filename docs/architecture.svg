<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 908" width="1200" height="908" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1200" height="908" fill="#ffffff"/>
<rect x="40" y="24" width="1120" height="138" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
<text x="56" y="50" font-size="16" font-weight="bold" fill="#333">Control machine</text>
<rect x="70" y="62" width="300" height="84" rx="8" fill="#f0f0f0" stroke="#888888" stroke-width="1.5"/>
<text x="220.0" y="88" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Ansible playbooks</text>
<text x="220.0" y="108" font-size="13" text-anchor="middle" fill="#333">host setup, genesis, join, stake,</text>
<text x="220.0" y="126" font-size="13" text-anchor="middle" fill="#333">failover, reset, monitoring agents</text>
<rect x="450" y="62" width="300" height="84" rx="8" fill="#f0f0f0" stroke="#888888" stroke-width="1.5"/>
<text x="600.0" y="88" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">solana CLI</text>
<text x="600.0" y="108" font-size="13" text-anchor="middle" fill="#333">stake, vote-account and</text>
<text x="600.0" y="126" font-size="13" text-anchor="middle" fill="#333">status commands over RPC</text>
<rect x="830" y="62" width="300" height="84" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="980.0" y="88" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Keys that never reach a host</text>
<text x="980.0" y="108" font-size="13" text-anchor="middle" fill="#333">withdraw authority of the vote account,</text>
<text x="980.0" y="126" font-size="13" text-anchor="middle" fill="#333">delegator wallets and stake accounts</text>
<line x1="830" y1="104" x2="750" y2="104" stroke="#444" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="790" y="96" font-size="12" text-anchor="middle" fill="#222">signs</text>
<rect x="40" y="232" width="1120" height="350" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
<text x="56" y="258" font-size="16" font-weight="bold" fill="#333">Docker network 172.30.0.0/24: four systemd hosts, each with ledger / accounts / snapshots volumes</text>
<rect x="330" y="290" width="540" height="120" rx="12" fill="none" stroke="#6c8ebf" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="70" y="296" width="250" height="108" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="195.0" y="322" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">bootstrap  .11</text>
<text x="195.0" y="342" font-size="13" text-anchor="middle" fill="#333">genesis validator, no spare</text>
<text x="195.0" y="360" font-size="13" text-anchor="middle" fill="#333">10,000 SOL of stake written into genesis</text>
<text x="195.0" y="378" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">syncs, votes, produces blocks</text>
<rect x="340" y="296" width="250" height="108" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="465.0" y="322" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">validator2  .12</text>
<text x="465.0" y="342" font-size="13" text-anchor="middle" fill="#333">joined later; primary</text>
<text x="465.0" y="360" font-size="13" text-anchor="middle" fill="#333">stake delegated by three delegators</text>
<text x="465.0" y="378" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">syncs, votes, produces blocks</text>
<rect x="610" y="296" width="250" height="108" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="735.0" y="322" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">spare  .14</text>
<text x="735.0" y="342" font-size="13" text-anchor="middle" fill="#333">hot spare for validator2</text>
<text x="735.0" y="360" font-size="13" text-anchor="middle" fill="#333">unstaked identity until a switch</text>
<text x="735.0" y="378" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">syncs only</text>
<rect x="880" y="296" width="250" height="108" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="1005.0" y="322" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">rpc  .13</text>
<text x="1005.0" y="342" font-size="13" text-anchor="middle" fill="#333">RPC node</text>
<text x="1005.0" y="360" font-size="13" text-anchor="middle" fill="#333">keeps transaction history</text>
<text x="1005.0" y="378" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">syncs only, answers queries</text>
<text x="330" y="284" font-size="12.5" text-anchor="middle" fill="#222">blocks, votes</text>
<line x1="320" y1="350" x2="340" y2="350" stroke="#444" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="600" y="284" font-size="12.5" text-anchor="middle" fill="#222">identity switch</text>
<line x1="590" y1="350" x2="610" y2="350" stroke="#444" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="195" y="428" font-size="12.5" text-anchor="middle" fill="#222">stands in for the rest of the network</text>
<text x="600" y="428" font-size="12.5" text-anchor="middle" fill="#222">the validator we operate: withdraw authority offline, hot spare, scripts/failover.sh</text>
<text x="600" y="462" font-size="13" text-anchor="middle" fill="#222">All four run the same agave-validator binary as a systemd service, and all four sync the chain:</text>
<text x="600" y="481" font-size="13" text-anchor="middle" fill="#222">they gossip with each other, receive every block, replay it and store it. Start-up flags decide the rest.</text>
<text x="600" y="510" font-size="13" text-anchor="middle" fill="#222">Voting costs a fee per slot and needs a funded identity. The spare and the RPC node do not vote, so they cost nothing on chain.</text>
<text x="600" y="539" font-size="13" text-anchor="middle" fill="#222">A switch waits for a gap in the leader schedule, moves the tower file with a checksum, and rolls back a failed takeover.</text>
<text x="600" y="564" font-size="13" text-anchor="middle" fill="#222">On every host: node_exporter, solana-exporter and Alloy, also as systemd services.</text>
<line x1="220" y1="146" x2="220" y2="232" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<text x="232" y="196" font-size="12.5" text-anchor="start" fill="#222">configures every host</text>
<line x1="600" y1="146" x2="600" y2="196" stroke="#444" stroke-width="1.8"/>
<line x1="600" y1="196" x2="1005" y2="196" stroke="#444" stroke-width="1.8"/>
<line x1="1005" y1="196" x2="1005" y2="296" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<text x="800" y="188" font-size="12.5" text-anchor="middle" fill="#222">RPC on 127.0.0.1:8999</text>
<rect x="40" y="652" width="1120" height="232" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
<text x="56" y="678" font-size="16" font-weight="bold" fill="#333">Monitoring stack</text>
<text x="56" y="700" font-size="13" text-anchor="start" fill="#222">Alert rules in five layers: 1 cluster, 2 validators, 3 funds, 4 nodes, 5 foundation (hosts and the monitoring itself).</text>
<text x="56" y="719" font-size="13" text-anchor="start" fill="#222">Three priorities: p1 page now, p2 tell the on-call, p3 ticket. The same fault is p1 on the staked host and p2 on the spare.</text>
<rect x="70" y="738" width="180" height="92" rx="8" fill="#f0f0f0" stroke="#888888" stroke-width="1.5"/>
<text x="160.0" y="764" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Loki</text>
<text x="160.0" y="784" font-size="13" text-anchor="middle" fill="#333">validator logs and</text>
<text x="160.0" y="802" font-size="13" text-anchor="middle" fill="#333">the service journal</text>
<rect x="290" y="738" width="210" height="92" rx="8" fill="#f0f0f0" stroke="#888888" stroke-width="1.5"/>
<text x="395.0" y="764" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Prometheus</text>
<text x="395.0" y="784" font-size="13" text-anchor="middle" fill="#333">scrapes every 5 s, 33 rules,</text>
<text x="395.0" y="802" font-size="13" text-anchor="middle" fill="#333">unit-tested identity alerts</text>
<rect x="540" y="738" width="190" height="92" rx="8" fill="#f0f0f0" stroke="#888888" stroke-width="1.5"/>
<text x="635.0" y="764" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Alertmanager</text>
<text x="635.0" y="784" font-size="13" text-anchor="middle" fill="#333">routes by severity,</text>
<text x="635.0" y="802" font-size="13" text-anchor="middle" fill="#333">inhibits by cause</text>
<rect x="770" y="738" width="140" height="92" rx="8" fill="#f0f0f0" stroke="#888888" stroke-width="1.5"/>
<text x="840.0" y="764" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Alert sink</text>
<text x="840.0" y="784" font-size="13" text-anchor="middle" fill="#333">stands in for a pager,</text>
<text x="840.0" y="802" font-size="13" text-anchor="middle" fill="#333">counts deliveries</text>
<rect x="950" y="738" width="180" height="92" rx="8" fill="#f0f0f0" stroke="#888888" stroke-width="1.5"/>
<text x="1040.0" y="764" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Grafana</text>
<text x="1040.0" y="784" font-size="13" text-anchor="middle" fill="#333">opens with one row per validator:</text>
<text x="1040.0" y="802" font-size="13" text-anchor="middle" fill="#333">host, stake, balance, days left</text>
<line x1="500" y1="784" x2="540" y2="784" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="730" y1="784" x2="770" y2="784" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<text x="520" y="776" font-size="11.5" text-anchor="middle" fill="#222">fires</text>
<text x="750" y="776" font-size="11.5" text-anchor="middle" fill="#222">notifies</text>
<line x1="160" y1="830" x2="160" y2="858" stroke="#444" stroke-width="1.8"/>
<line x1="395" y1="830" x2="395" y2="858" stroke="#444" stroke-width="1.8"/>
<line x1="160" y1="858" x2="1040" y2="858" stroke="#444" stroke-width="1.8"/>
<line x1="1040" y1="858" x2="1040" y2="830" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<text x="700" y="875" font-size="12" text-anchor="middle" fill="#222">queried by Grafana</text>
<line x1="160" y1="582" x2="160" y2="652" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<text x="172" y="622" font-size="12.5" text-anchor="start" fill="#222">logs: Alloy ships WARN and ERROR in full, INFO sampled</text>
<line x1="700" y1="582" x2="700" y2="652" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<text x="712" y="622" font-size="12.5" text-anchor="start" fill="#222">metrics: node_exporter, solana-exporter, vote credits</text>
</svg>
