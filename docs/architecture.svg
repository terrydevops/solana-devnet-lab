<text x="160.0" y="676" font-size="13" text-anchor="middle" fill="#333">the service journal</text>
<rect x="300" y="612" width="200" height="100" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
<text x="400.0" y="638" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Prometheus</text>
<text x="400.0" y="658" font-size="13" text-anchor="middle" fill="#333">32 rules in five layers,</text>
<text x="400.0" y="676" font-size="13" text-anchor="middle" fill="#333">unit-tested identity alerts</text>
<rect x="550" y="612" width="200" height="100" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
<text x="650.0" y="638" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Alertmanager</text>
<text x="650.0" y="658" font-size="13" text-anchor="middle" fill="#333">page / ticket,</text>
