<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1200" height="760" fill="#ffffff"/>
<rect x="40" y="24" width="1120" height="138" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
<text x="56" y="50" font-size="16" font-weight="bold" fill="#333">Control machine</text>
<rect x="70" y="62" width="300" height="84" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
<text x="220.0" y="88" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Ansible playbooks</text>
<text x="220.0" y="108" font-size="13" text-anchor="middle" fill="#333">host setup, genesis, join, stake,</text>
<text x="220.0" y="126" font-size="13" text-anchor="middle" fill="#333">failover, reset, monitoring agents</text>
<rect x="450" y="62" width="300" height="84" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
<text x="600.0" y="88" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">solana CLI</text>
<text x="600.0" y="108" font-size="13" text-anchor="middle" fill="#333">stake, vote-account and</text>
<text x="600.0" y="126" font-size="13" text-anchor="middle" fill="#333">status commands over RPC</text>
<rect x="830" y="62" width="300" height="84" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="980.0" y="88" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Keys that never reach a host</text>
<text x="980.0" y="108" font-size="13" text-anchor="middle" fill="#333">withdraw authority of the vote account,</text>
<text x="980.0" y="126" font-size="13" text-anchor="middle" fill="#333">delegator wallets and stake accounts</text>
<rect x="40" y="232" width="1120" height="262" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
<text x="56" y="258" font-size="16" font-weight="bold" fill="#333">Docker network 172.30.0.0/24: four systemd hosts, each with ledger / accounts / snapshots volumes</text>
<rect x="70" y="290" width="250" height="118" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="195.0" y="316" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">bootstrap  .11</text>
<text x="195.0" y="336" font-size="13" text-anchor="middle" fill="#333">genesis validator</text>
<text x="195.0" y="354" font-size="13" text-anchor="middle" fill="#333">votes, produces blocks</text>
<text x="195.0" y="372" font-size="13" text-anchor="middle" fill="#333"></text>
<text x="195.0" y="390" font-size="13" text-anchor="middle" fill="#333">agave-validator as a systemd service</text>
<rect x="340" y="290" width="250" height="118" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="465.0" y="316" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">validator2  .12</text>
<text x="465.0" y="336" font-size="13" text-anchor="middle" fill="#333">staked identity</text>
<text x="465.0" y="354" font-size="13" text-anchor="middle" fill="#333">votes, produces blocks</text>
<text x="465.0" y="372" font-size="13" text-anchor="middle" fill="#333"></text>
<text x="465.0" y="390" font-size="13" text-anchor="middle" fill="#333">agave-validator as a systemd service</text>
<rect x="610" y="290" width="250" height="118" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="735.0" y="316" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">spare  .14</text>
<text x="735.0" y="336" font-size="13" text-anchor="middle" fill="#333">hot spare, unstaked identity</text>
<text x="735.0" y="354" font-size="13" text-anchor="middle" fill="#333">follows the chain</text>
<text x="735.0" y="372" font-size="13" text-anchor="middle" fill="#333"></text>
<text x="735.0" y="390" font-size="13" text-anchor="middle" fill="#333">agave-validator as a systemd service</text>
<rect x="880" y="290" width="250" height="118" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="1005.0" y="316" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">rpc  .13</text>
<text x="1005.0" y="336" font-size="13" text-anchor="middle" fill="#333">non-voting</text>
<text x="1005.0" y="354" font-size="13" text-anchor="middle" fill="#333">transaction history</text>
<text x="1005.0" y="372" font-size="13" text-anchor="middle" fill="#333"></text>
<text x="1005.0" y="390" font-size="13" text-anchor="middle" fill="#333">agave-validator as a systemd service</text>
<text x="600" y="446" font-size="13" text-anchor="middle" fill="#333">On every host: node_exporter, solana-exporter and Alloy as systemd services. All four nodes gossip with each other.</text>
<text x="600" y="470" font-size="13" text-anchor="middle" fill="#333">Green hosts vote. The staked identity of validator2 can move to the spare and back without a restart.</text>
<line x1="320" y1="349" x2="340" y2="349" stroke="#444" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="330" y="282" font-size="12.5" text-anchor="middle" fill="#222">blocks, votes</text>
<line x1="590" y1="349" x2="610" y2="349" stroke="#444" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="600" y="282" font-size="12.5" text-anchor="middle" fill="#222">identity switch</text>
<line x1="220" y1="146" x2="220" y2="232" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<text x="232" y="196" font-size="12.5" text-anchor="start" fill="#222" paint-order="stroke" stroke="#ffffff" stroke-width="4">configures every host</text>
<line x1="600" y1="146" x2="600" y2="196" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="600" y1="196" x2="1005" y2="196" stroke="#444" stroke-width="1.8"/>
<line x1="1005" y1="196" x2="1005" y2="290" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<text x="800" y="188" font-size="12.5" text-anchor="middle" fill="#222" paint-order="stroke" stroke="#ffffff" stroke-width="4">RPC on 127.0.0.1:8999</text>
<line x1="830" y1="104" x2="750" y2="104" stroke="#444" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="790" y="96" font-size="12" text-anchor="middle" fill="#222">signs</text>
<rect x="40" y="566" width="1120" height="170" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
<text x="56" y="592" font-size="16" font-weight="bold" fill="#333">Monitoring stack</text>
<rect x="70" y="612" width="180" height="100" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
