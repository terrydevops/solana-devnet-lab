# Extra secret rules for the key material handled in this repo. The builtin
# rules match neither form of a Solana keypair.
rules:
  - id: solana-keypair-json
    category: Solana
    title: Solana keypair file (JSON array of 64 bytes)
    severity: CRITICAL
    regex: '\[\s*(\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'
  - id: solana-keypair-base58
    category: Solana
    title: Solana keypair as a base58 string
    severity: CRITICAL
    regex: '\b[1-9A-HJ-NP-Za-km-z]{87,88}\b'
    # scoped by path: a transaction signature is base58 of the same length
    path: '(\.json|\.key|\.env)$'
