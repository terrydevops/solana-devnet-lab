# Alert routing for the Solana lab.
#
# Delivery is a local webhook sink: a receiver that is always reachable makes the routing itself
# observable without depending on a real chat workspace. Swap the receivers to ship somewhere real.

global:
  resolve_timeout: 5m

route:
  # One broken node should produce one notification, not one per rule that noticed.
  group_by: ['alertname', 'node', 'nodekey']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  routes:
    - matchers:
        - severity = "page"
      receiver: page
      group_wait: 10s
      repeat_interval: 1h

    - matchers:
        - severity = "ticket"
      receiver: ticket
      group_wait: 5m
      repeat_interval: 24h

inhibit_rules:
  # While the whole cluster is stalled, every validator and node symptom is downstream of it.
  - source_matchers:
      - alertname = "ClusterRootStalled"
    target_matchers:
      - alertname =~ "Validator(Delinquent|VoteLagging|RootStalled|SkipRateHigh)|Node(SlotStalled|FallingBehind|Unhealthy)"

  # A node whose exporter cannot reach it will also look stalled and unhealthy.
  - source_matchers:
      - alertname = "NodeDown"
    target_matchers:
      - alertname =~ "Node(SlotStalled|FallingBehind|Unhealthy)"
    equal: ['node']

  # A crash loop or a stopped service explains a stalled or unhealthy node on the same host.
  - source_matchers:
      - alertname =~ "ValidatorServiceRestarting|ValidatorServiceNotActive"
    target_matchers:
      - alertname =~ "Node(Down|SlotStalled|FallingBehind|Unhealthy)"
    equal: ['node']

  # An identity nobody runs explains why that validator stops voting.
  - source_matchers:
      - alertname = "VotingIdentityNotHeld"
    target_matchers:
      - alertname =~ "Validator(Delinquent|VoteLagging|RootStalled)"

receivers:
  - name: default
    webhook_configs:
      - url: http://alert-sink:9099/alerts
        send_resolved: true
  - name: page
    webhook_configs:
      - url: http://alert-sink:9099/alerts?severity=page
        send_resolved: true
  - name: ticket
    webhook_configs:
      - url: http://alert-sink:9099/alerts?severity=ticket
        send_resolved: true
