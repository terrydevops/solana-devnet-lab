global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Chain metrics. The exporters run on the hosts as systemd services (ansible/monitoring.yml),
  # next to the validator they poll. The `node` label is what the alert rules and the inhibit
  # rules join on.
  - job_name: solana
    static_configs:
      - targets: ['172.30.0.11:9101']
        labels: { node: bootstrap, role: validator }
      - targets: ['172.30.0.12:9101']
        labels: { node: validator2, role: validator }
      - targets: ['172.30.0.13:9101']
        labels: { node: rpc, role: rpc }
      - targets: ['172.30.0.14:9101']
        labels: { node: spare, role: spare }

  # Vote credits for every validator, asked once, on the RPC node.
  - job_name: solana-credits
    static_configs:
      - targets: ['172.30.0.13:9102']
        labels: { node: rpc }

  # Host metrics. node_exporter runs on each host as a systemd service, installed by Ansible
  # (ansible/monitoring.yml), with the systemd collector on so service restarts are visible.
  - job_name: node
    static_configs:
      - targets: ['172.30.0.11:9100']
        labels: { node: bootstrap }
      - targets: ['172.30.0.12:9100']
        labels: { node: validator2 }
      - targets: ['172.30.0.13:9100']
        labels: { node: rpc }
      - targets: ['172.30.0.14:9100']
        labels: { node: spare }

  # Log shipper on each host. If it stops, the logs stop and nothing else notices.
  - job_name: alloy
    static_configs:
      - targets: ['172.30.0.11:12345']
        labels: { node: bootstrap }
      - targets: ['172.30.0.12:12345']
        labels: { node: validator2 }
      - targets: ['172.30.0.13:12345']
        labels: { node: rpc }
      - targets: ['172.30.0.14:12345']
        labels: { node: spare }

  # The monitoring stack watching itself: a collector that stops collecting or a delivery path
  # that goes quiet is a silent failure otherwise.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
  - job_name: alert-sink
    static_configs:
      - targets: ['alert-sink:9099']
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
