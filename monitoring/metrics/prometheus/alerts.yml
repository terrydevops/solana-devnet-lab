# Alerting rules, grouped by layer. Alerting runs top-down: page for the cause, stay quiet about
# the symptoms (inhibit rules in alertmanager.yml). Diagnosis runs bottom-up.
#
# Three priorities, by what happens if nobody acts:
#   p1  page now, at any hour. Rewards or reputation are being lost at this moment, or will be
#       within the hour, and a person can do something about it.
#   p2  tell the on-call now, do not wake them. Nothing is lost yet, but the safety margin is gone
#       (the spare is down, the disk fills tomorrow) or the monitoring is partly blind.
#   p3  a ticket for working hours. Trends and hygiene.
#
# The same fault has a different priority on different hosts: a dead validator process is p1 on
# the host that runs a staked identity and p2 on the hot spare or the RPC node.
#
# Every threshold here is a starting value for a two-validator lab with 400 ms slots. On real
# hosts they come from a baseline, not from this file.

groups:
  # ---- recording rules -----------------------------------------------------
  # The exporter counts leader slots as valid or skipped. A rate needs a window, so it is
  # computed here.
  - name: solana-recording
    interval: 30s
    rules:
      - record: solana:validator_skip_rate:1h
        expr: >
          sum by (nodekey) (increase(solana_validator_leader_slots_total{status="skipped"}[1h]))
          / sum by (nodekey) (increase(solana_validator_leader_slots_total[1h]))
      - record: solana:cluster_skip_rate:1h
        expr: >
          sum(increase(solana_validator_leader_slots_total{status="skipped"}[1h]))
          / sum(increase(solana_validator_leader_slots_total[1h]))
      # How far a validator's last vote trails the newest vote in the cluster, in slots.
      - record: solana:validator_vote_lag:slots
        expr: scalar(max(solana_cluster_last_vote)) - solana_validator_last_vote

      # The exporter reports the balance of identity accounts and of vote accounts under one
      # metric. A vote account holds only its rent reserve, so a rule on the raw metric would
      # fire for it forever. Keep only addresses that are a validator identity (nodekey).
      - record: solana:identity_balance:sol
        expr: >
          solana_account_balance
          and on (address)
          label_replace(group by (nodekey) (solana_validator_last_vote), "address", "$1", "nodekey", "(.+)")

      # 1 for a host that ran a staked (voting) identity at any time in the last ten minutes.
      # "In the last ten minutes" on purpose: when such a host dies its exporter dies with it,
      # and the alert about that death must still know what the host was.
      - record: solana:host_ran_voting_identity:10m
        expr: >
          max_over_time((
            max by (node) (
              solana_node_identity
              and on (identity)
              label_replace(group by (nodekey) (solana_validator_last_vote), "identity", "$1", "nodekey", "(.+)")
            )
          )[10m:])

      # Each validator's share of all active stake. The share, not the amount, decides how many
      # leader slots a validator gets, and it can shrink while the amount stays the same.
      - record: solana:validator_stake_share:ratio
        expr: solana_validator_active_stake / scalar(max(solana_cluster_active_stake))

      # How many hosts run each voting identity right now. Every host reports the identity it
      # runs (solana_node_identity); the RPC node reports which identities are validators. The
      # answer must be exactly 1: 2 is two machines able to vote with one identity, 0 (no
      # series) is nobody voting for it. An identity moves between hosts in a failover.
      - record: solana:voting_identity_hosts:count
        expr: >
          count by (identity) (
            solana_node_identity
            and on (identity)
            label_replace(group by (nodekey) (solana_validator_last_vote), "identity", "$1", "nodekey", "(.+)")
          )

      # Share of the best validator's credit rate that each validator earns. A rate, not the
      # per-epoch value, so it does not jump at an epoch boundary.
      - record: solana:validator_credits_ratio:10m
        expr: >
          rate(solana_vote_credits_total[10m])
          / scalar(max(rate(solana_vote_credits_total[10m])))

  # ---- layer 1: cluster ----------------------------------------------------
  # Is the chain itself moving? While it is not, nothing below means anything.
  - name: cluster
    rules:
      # The root is the newest slot that can no longer be rolled back. Slots can keep coming
      # while roots stop: that is a cluster that produces blocks but does not agree on them.
      - alert: ClusterRootStalled
        expr: increase(solana_cluster_root_slot[2m]) == 0
        for: 1m
        labels:
          severity: p1
        annotations:
          summary: "cluster root slot has not advanced in 2 minutes"

      # The skip-rate rules are blind when the leader-slot counters stop moving, and a blind rule
      # looks exactly like a healthy one. Slots keep being finalized, so somebody is leader.
      - alert: LeaderSlotCountersStalled
        expr: >
          sum(increase(solana_validator_leader_slots_total[10m])) == 0
          and on () increase(max(solana_cluster_root_slot)[10m:]) > 0
        for: 5m
        labels:
          severity: p2
        annotations:
          summary: "leader slots are no longer being counted: skip rates and their alerts are blind"

      - alert: ClusterSkipRateHigh
        expr: solana:cluster_skip_rate:1h > 0.25
        for: 15m
        labels:
          severity: p3
        annotations:
          summary: "more than a quarter of leader slots in the cluster were skipped over the last hour"

  # ---- layer 2: our validators ---------------------------------------------
  # Are we doing the job we are paid for? Votes earn credits, leader slots earn fees.
  - name: validator
    rules:
      # The cluster's own verdict: this validator's votes are too far behind. Delegators see
      # this mark. It is late by design, so the lag rule below should fire first.
      - alert: ValidatorDelinquent
        expr: solana_validator_delinquent == 1
        for: 30s
        labels:
          severity: p1
        annotations:
          summary: "validator {{ $labels.nodekey }} is marked delinquent"

      # Early version of the same failure, before the cluster marks us.
      - alert: ValidatorVoteLagging
        expr: solana:validator_vote_lag:slots > 50
        # Short on purpose. Measured here on 2026-10-08: with `for: 1m` the delinquent alert
        # fired first, about 70 seconds after the validator stopped, and this one was still
        # pending. An early warning that arrives after the verdict is no warning.
        for: 15s
        labels:
          severity: p1
        annotations:
          summary: "validator {{ $labels.nodekey }} last voted {{ $value }} slots behind the cluster"

      # Catch-all for a stuck node, whatever the reason: its own root does not move.
      - alert: ValidatorRootStalled
        expr: increase(solana_validator_root_slot[3m]) == 0
        for: 1m
        labels:
          severity: p1
        annotations:
          summary: "validator {{ $labels.nodekey }} root slot has not advanced in 3 minutes"

      # The one rule of failover, watched from outside: never two machines with one voting
      # identity. No waiting: every second of this is a second in which both can sign votes.
      - alert: VotingIdentityOnTwoHosts
        expr: solana:voting_identity_hosts:count > 1
        labels:
          severity: p1
        annotations:
          summary: "identity {{ $labels.identity }} runs on {{ $value }} hosts at once"

      # A validator identity that no host runs: a failover that let go and never took over, or
      # a host that came back from a reboot with its unstaked key. The wait is longer than a
      # clean switch (under 2 s here) and long enough for one missed scrape. If the exporter on
      # the holding host is down this fires too; NodeDown inhibits it then.
      - alert: VotingIdentityNotHeld
        expr: >
          label_replace(group by (nodekey) (solana_validator_last_vote), "identity", "$1", "nodekey", "(.+)")
          unless on (identity) solana_node_identity
        for: 30s
        labels:
          severity: p1
        annotations:
          summary: "no host runs validator identity {{ $labels.identity }}"

      # Leader slots are where fees come from. A skipped slot is income that went to nobody.
      - alert: ValidatorSkipRateHigh
        expr: solana:validator_skip_rate:1h > 0.20
        for: 15m
        labels:
          severity: p3
        annotations:
          summary: "validator {{ $labels.nodekey }} skipped over 20% of its leader slots in the last hour"

      # The degradation nobody notices: the validator votes, is never delinquent, and earns less
      # than its peers because its votes land late. Compared with the best validator in the
      # cluster, because credits are what rewards are paid on.
      - alert: ValidatorCreditsBehind
        expr: solana:validator_credits_ratio:10m < 0.90
        for: 15m
        labels:
          severity: p3
        annotations:
          summary: "validator {{ $labels.nodekey }} earns {{ $value | humanizePercentage }} of the best validator's vote credits"

      # A business signal, not a fault: a delegator left, or stake is deactivating.
      - alert: ValidatorStakeDropped
        expr: >
          solana_validator_active_stake
          < 0.9 * (solana_validator_active_stake offset 1h)
        for: 5m
        labels:
          severity: p3
        annotations:
          summary: "active stake of {{ $labels.nodekey }} fell more than 10% within an hour"

      # The same question as a share of the cluster. Fires when our slice shrinks for any
      # reason, including other validators gaining stake while ours stands still.
      - alert: ValidatorStakeShareDropped
        expr: >
          solana:validator_stake_share:ratio
          < 0.9 * (solana:validator_stake_share:ratio offset 1h)
        for: 5m
        labels:
          severity: p3
        annotations:
          summary: "stake share of {{ $labels.nodekey }} is {{ $value | humanizePercentage }}, more than 10% below an hour ago"

  # ---- layer 3: funds ------------------------------------------------------
  # Voting is paid for from the identity account. When it is empty the validator stops voting
  # and goes delinquent. Fully predictable, so alert on the projection.
  - name: funds
    rules:
      - alert: IdentityBalanceRunningOut
        expr: predict_linear(solana:identity_balance:sol[6h], 3 * 24 * 3600) < 0
        for: 30m
        labels:
          severity: p2
        annotations:
          summary: "identity account {{ $labels.address }} is projected to be empty within 3 days"

      - alert: IdentityBalanceLow
        expr: solana:identity_balance:sol < 1
        for: 10m
        labels:
          severity: p1
        annotations:
          summary: "identity account {{ $labels.address }} holds less than 1 SOL"

  # ---- layer 4: node and service -------------------------------------------
  # Per node, seen from the node itself.
  - name: node
    rules:
      - alert: NodeUnhealthy
        expr: >
          (solana_node_is_healthy == 0)
          and on (node) solana:host_ran_voting_identity:10m
        for: 1m
        labels:
          severity: p1
        annotations:
          summary: "node {{ $labels.node }} reports itself unhealthy (host runs a staked identity)"

      - alert: NodeUnhealthy
        expr: >
          (solana_node_is_healthy == 0)
          unless on (node) solana:host_ran_voting_identity:10m
        for: 1m
        labels:
          severity: p2
        annotations:
          summary: "node {{ $labels.node }} reports itself unhealthy (standby or RPC host: redundancy or service lost, no stake at risk)"

      - alert: NodeFallingBehind
        expr: >
          (solana_node_num_slots_behind > 50)
          and on (node) solana:host_ran_voting_identity:10m
        for: 2m
        labels:
          severity: p1
        annotations:
          summary: "node {{ $labels.node }} is {{ $value }} slots behind the cluster (host runs a staked identity)"

      - alert: NodeFallingBehind
        expr: >
          (solana_node_num_slots_behind > 50)
          unless on (node) solana:host_ran_voting_identity:10m
        for: 2m
        labels:
          severity: p2
        annotations:
          summary: "node {{ $labels.node }} is {{ $value }} slots behind the cluster (standby or RPC host: redundancy or service lost, no stake at risk)"

      # The node answers but its slot counter does not move.
      - alert: NodeSlotStalled
        expr: >
          (increase(solana_node_slot_height[2m]) == 0)
          and on (node) solana:host_ran_voting_identity:10m
        for: 1m
        labels:
          severity: p1
        annotations:
          summary: "node {{ $labels.node }} slot height has not advanced in 2 minutes (host runs a staked identity)"

      - alert: NodeSlotStalled
        expr: >
          (increase(solana_node_slot_height[2m]) == 0)
          unless on (node) solana:host_ran_voting_identity:10m
        for: 1m
        labels:
          severity: p2
        annotations:
          summary: "node {{ $labels.node }} slot height has not advanced in 2 minutes (standby or RPC host: redundancy or service lost, no stake at risk)"

      # Mixed versions are normal for the length of a rolling upgrade and a mistake after it.
      - alert: NodeVersionMismatch
        expr: count(count by (version) (solana_node_version)) > 1
        for: 1h
        labels:
          severity: p3
        annotations:
          summary: "nodes have been running different versions for over an hour"

  # ---- layer 5: foundation -------------------------------------------------
  # Is any of this being measured? A dead exporter looks exactly like a quiet system.
  - name: foundation
    rules:
      - alert: NodeDown
        expr: >
          (up{job="solana"} == 0)
          and on (node) solana:host_ran_voting_identity:10m
        for: 1m
        labels:
          severity: p1
        annotations:
          summary: "exporter for node {{ $labels.node }} is not being scraped (host runs a staked identity)"

      - alert: NodeDown
        expr: >
          (up{job="solana"} == 0)
          unless on (node) solana:host_ran_voting_identity:10m
        for: 1m
        labels:
          severity: p2
        annotations:
          summary: "exporter for node {{ $labels.node }} is not being scraped (standby or RPC host: redundancy or service lost, no stake at risk)"

      - alert: MonitoringTargetDown
        expr: up{job=~"prometheus|alertmanager|alert-sink|grafana|loki|solana-credits"} == 0
        for: 2m
        labels:
          severity: p2
        annotations:
          summary: "monitoring component {{ $labels.job }} is not being scraped"

      - alert: HostAgentDown
        expr: up{job=~"node|alloy"} == 0
        for: 2m
        labels:
          severity: p2
        annotations:
          summary: "agent {{ $labels.job }} on {{ $labels.node }} is not being scraped"

      # The next three are the rules that were missing on 2026-10-08, when the disk filled and
      # systemd restarted the validators for six hours. They read node_exporter on the hosts.

      # Solana ledgers grow by the second, so the window is short: hours, not days.
      - alert: HostDiskWillFillSoon
        expr: >
          predict_linear(node_filesystem_avail_bytes{mountpoint=~"/mnt/(ledger|accounts|snapshots)"}[1h],
            24 * 3600) < 0
        for: 15m
        labels:
          severity: p2
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.node }} is projected to fill within 24 hours"

      - alert: HostDiskSpaceLow
        expr: >
          (node_filesystem_avail_bytes{mountpoint=~"/mnt/(ledger|accounts|snapshots)"} / node_filesystem_size_bytes{mountpoint=~"/mnt/(ledger|accounts|snapshots)"} < 0.15)
          and on (node) solana:host_ran_voting_identity:10m
        for: 5m
        labels:
          severity: p1
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.node }} has under 15% free space (host runs a staked identity)"

      - alert: HostDiskSpaceLow
        expr: >
          (node_filesystem_avail_bytes{mountpoint=~"/mnt/(ledger|accounts|snapshots)"} / node_filesystem_size_bytes{mountpoint=~"/mnt/(ledger|accounts|snapshots)"} < 0.15)
          unless on (node) solana:host_ran_voting_identity:10m
        for: 5m
        labels:
          severity: p2
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.node }} has under 15% free space (standby or RPC host: redundancy or service lost, no stake at risk)"

      # Restart=on-failure keeps a crashing service looking alive. Count the restarts.
      - alert: ValidatorServiceRestarting
        expr: >
          (increase(node_systemd_service_restart_total{name="sol.service"}[15m]) > 2)
          and on (node) solana:host_ran_voting_identity:10m
        labels:
          severity: p1
        annotations:
          summary: "sol.service on {{ $labels.node }} restarted more than twice in 15 minutes (host runs a staked identity)"

      - alert: ValidatorServiceRestarting
        expr: >
          (increase(node_systemd_service_restart_total{name="sol.service"}[15m]) > 2)
          unless on (node) solana:host_ran_voting_identity:10m
        labels:
          severity: p2
        annotations:
          summary: "sol.service on {{ $labels.node }} restarted more than twice in 15 minutes (standby or RPC host: redundancy or service lost, no stake at risk)"

      # The unit is neither running nor being restarted: someone stopped it, or it gave up.
      # The spare is included: a hot spare that is not running is not a spare.
      - alert: ValidatorServiceNotActive
        expr: >
          (node_systemd_unit_state{name="sol.service",state="active"} == 0)
          and on (node) solana:host_ran_voting_identity:10m
        for: 2m
        labels:
          severity: p1
        annotations:
          summary: "sol.service on {{ $labels.node }} is not active (host runs a staked identity)"

      - alert: ValidatorServiceNotActive
        expr: >
          (node_systemd_unit_state{name="sol.service",state="active"} == 0)
          unless on (node) solana:host_ran_voting_identity:10m
        for: 2m
        labels:
          severity: p2
        annotations:
          summary: "sol.service on {{ $labels.node }} is not active (standby or RPC host: redundancy or service lost, no stake at risk)"

      # The accounts database is memory-mapped; a validator short of memory is killed by the
      # kernel and comes back through the restart rule above. This is the earlier signal.
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: p2
        annotations:
          summary: "{{ $labels.node }} has under 10% of memory available"

  # ==== service level objectives ===========================================
  # The layers above say what is broken. These say whether the validator is doing what its
  # delegators are paid on, measured over time and against a stated target.
  #
  #   credits       earn at least 99% of the vote credits the best validator in the cluster earns
  #   leader slots  produce a block in at least 98% of our leader slots
  #   voting time   not marked delinquent for at least 99.9% of the time
  #
  # The error budget is what the target allows to be lost: 1% of credits, 2% of leader slots,
  # 0.1% of the time. A burn rate of 1 spends the budget exactly as fast as the target permits.
  # Alerting uses two windows at once, so a short blip does not page and a slow leak is still
  # caught: a fast burn is p1, a slow burn a ticket.
  #
  # The targets are placeholders for a lab. Real ones come from what the delegators are promised.
  - name: slo-recording
    interval: 30s
    rules:
      - record: slo:credits:ratio_rate5m
        expr: >
          sum by (nodekey) (rate(solana_vote_credits_total[5m]))
          / scalar(max(sum by (nodekey) (rate(solana_vote_credits_total[5m]))))
      - record: slo:credits_budget_burn:rate5m
        expr: (1 - slo:credits:ratio_rate5m) / (1 - 0.99)
      - record: slo:credits:ratio_rate30m
        expr: >
          sum by (nodekey) (rate(solana_vote_credits_total[30m]))
          / scalar(max(sum by (nodekey) (rate(solana_vote_credits_total[30m]))))
      - record: slo:credits_budget_burn:rate30m
        expr: (1 - slo:credits:ratio_rate30m) / (1 - 0.99)
      - record: slo:credits:ratio_rate1h
        expr: >
          sum by (nodekey) (rate(solana_vote_credits_total[1h]))
          / scalar(max(sum by (nodekey) (rate(solana_vote_credits_total[1h]))))
      - record: slo:credits_budget_burn:rate1h
        expr: (1 - slo:credits:ratio_rate1h) / (1 - 0.99)
      - record: slo:credits:ratio_rate6h
        expr: >
          sum by (nodekey) (rate(solana_vote_credits_total[6h]))
          / scalar(max(sum by (nodekey) (rate(solana_vote_credits_total[6h]))))
      - record: slo:credits_budget_burn:rate6h
        expr: (1 - slo:credits:ratio_rate6h) / (1 - 0.99)
      - record: slo:credits:ratio_rate1d
        expr: >
          sum by (nodekey) (rate(solana_vote_credits_total[1d]))
          / scalar(max(sum by (nodekey) (rate(solana_vote_credits_total[1d]))))
      - record: slo:credits_budget_burn:rate1d
        expr: (1 - slo:credits:ratio_rate1d) / (1 - 0.99)
      - record: slo:leader_slots:ratio_rate1h
        expr: >
          sum by (nodekey) (increase(solana_validator_leader_slots_total{status="valid"}[1h]))
          / clamp_min(sum by (nodekey) (increase(solana_validator_leader_slots_total[1h])), 1)
      - record: slo:leader_slots_budget_burn:rate1h
        expr: (1 - slo:leader_slots:ratio_rate1h) / (1 - 0.98)
      - record: slo:leader_slots:ratio_rate6h
        expr: >
          sum by (nodekey) (increase(solana_validator_leader_slots_total{status="valid"}[6h]))
          / clamp_min(sum by (nodekey) (increase(solana_validator_leader_slots_total[6h])), 1)
      - record: slo:leader_slots_budget_burn:rate6h
        expr: (1 - slo:leader_slots:ratio_rate6h) / (1 - 0.98)
      - record: slo:leader_slots:ratio_rate1d
        expr: >
          sum by (nodekey) (increase(solana_validator_leader_slots_total{status="valid"}[1d]))
          / clamp_min(sum by (nodekey) (increase(solana_validator_leader_slots_total[1d])), 1)
      - record: slo:leader_slots_budget_burn:rate1d
        expr: (1 - slo:leader_slots:ratio_rate1d) / (1 - 0.98)
      - record: slo:voting_time:ratio_1d
        expr: avg_over_time((1 - max by (nodekey) (solana_validator_delinquent))[1d:1m])
      # How much of the budget of the last 24 hours is left: 1 = untouched, 0 = spent, below 0 =
      # the target was missed. A day, not the usual 30: this cluster is reset every day or two.
      - record: slo:credits_budget_remaining:1d
        expr: 1 - (1 - slo:credits:ratio_rate1d) / (1 - 0.99)
      - record: slo:leader_slots_budget_remaining:1d
        expr: 1 - (1 - slo:leader_slots:ratio_rate1d) / (1 - 0.98)
      - record: slo:voting_time_budget_remaining:1d
        expr: 1 - (1 - slo:voting_time:ratio_1d) / (1 - 0.999)

  - name: slo-alerts
    rules:
      # 14.4 times too fast: a whole day's budget gone in under two hours.
      - alert: CreditsBudgetFastBurn
        expr: slo:credits_budget_burn:rate5m > 14.4 and slo:credits_budget_burn:rate1h > 14.4
        for: 2m
        labels:
          severity: p1
        annotations:
          summary: "validator {{ $labels.nodekey }} is spending its vote-credits budget {{ $value | humanize }} times too fast"

      # 6 times too fast over half an hour and over six hours: a steady leak, such as votes
      # landing late. Never delinquent, never noticed, and paid less every epoch.
      - alert: CreditsBudgetSlowBurn
        expr: slo:credits_budget_burn:rate30m > 6 and slo:credits_budget_burn:rate6h > 6
        for: 15m
        labels:
          severity: p3
        annotations:
          summary: "validator {{ $labels.nodekey }} has been earning below its 99% credits target for hours"

      - alert: LeaderSlotBudgetBurn
        expr: slo:leader_slots_budget_burn:rate1h > 6 and slo:leader_slots_budget_burn:rate6h > 6
        for: 15m
        labels:
          severity: p3
        annotations:
          summary: "validator {{ $labels.nodekey }} is skipping leader slots {{ $value | humanize }} times faster than its 98% target allows"
