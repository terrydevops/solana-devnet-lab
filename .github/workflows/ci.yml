# Checks only: lint, workflow audit, secret scan and image CVE scan. Nothing
# is deployed from here; the cluster runs on one machine and is driven by
# Ansible from that machine. Actions are pinned to commit shas and tool
# images to digests; the version comments are for dependabot.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'   # weekly: pins do not change, advisories do
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ECR mirror first, ghcr rate-limits anonymous DB pulls
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
      - name: yamllint
        run: pipx run yamllint==1.38.0 --strict .
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: python and node syntax
        run: |
          git ls-files -z '*.py' | xargs -0 python3 -m py_compile
          git ls-files -z '*.mjs' | xargs -0 -n1 node --check
      - name: ansible syntax
        run: |
          pipx install ansible-core==2.20.4
          ansible-galaxy collection install community.docker:5.1.0 ansible.posix:2.1.0
          cd ansible
          for p in site genesis join join-nonvoting spare stake failover takeover pair-status reset monitoring; do
            ansible-playbook --syntax-check -e from=validator2 -e to=spare "$p.yml"
          done
      - name: prometheus rules and their tests
        run: >
          docker run --rm --entrypoint sh
          -v "$PWD/monitoring/metrics/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          -c 'promtool check rules /etc/prometheus/alerts.yml && promtool test rules /etc/prometheus/tests/*.yml'
      - name: dashboard matches its generator
        run: |
          python3 monitoring/scripts/build-dashboard.py
          git diff --exit-code -- monitoring/grafana/dashboards
      - name: compose files render
        run: |
          for d in hosts monitoring; do (cd "$d" && docker compose config -q); done
      - name: image references are pinned
        run: .github/scripts/list-images.sh --check

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: audit workflows
        run: pipx run zizmor==1.30.0 --persona regular .github/workflows

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml

  images:
    name: list images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.images }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: list images
        id: list
        run: echo "images=$(.github/scripts/list-images.sh --json)" >> "$GITHUB_OUTPUT"

  image-scan:
    name: scan ${{ matrix.image }}
    needs: images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.images.outputs.matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
