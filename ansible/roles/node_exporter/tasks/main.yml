---
# node_exporter as a systemd service on the host, the way it runs on a real server.
# The systemd collector is on, with restart counts: Restart=on-failure keeps a crashing validator
# looking alive, and the restart counter is the only place that shows it.

- name: Service user without a shell or a home
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Installed version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: installed
  changed_when: false
  failed_when: false

- name: Download and install
  when: node_exporter_version not in (installed.stdout | default('')) ~ (installed.stderr | default(''))
  block:
    - name: Download the release archive (checksum verified)
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        checksum: "{{ node_exporter_checksums[node_exporter_arch] }}"
        mode: "0644"

    - name: Unpack
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install the binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart node_exporter

    - name: Remove the download
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"

- name: systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start
  ansible.builtin.systemd:
    name: node_exporter.service
    enabled: true
    state: started
    daemon_reload: true

- name: Run handlers now so the check below sees the new process
  ansible.builtin.meta: flush_handlers

- name: The endpoint answers and reports the validator unit
  ansible.builtin.uri:
    url: "http://{{ node_ip }}:{{ node_exporter_port }}/metrics"
    return_content: true
  register: metrics
  retries: 5
  delay: 2
  until: metrics.status == 200
  failed_when: "'node_filesystem_avail_bytes' not in metrics.content"
